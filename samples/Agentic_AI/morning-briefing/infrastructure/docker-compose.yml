version: "3.8"

services:
  # Mocks Slack, Calendar, and Reminders REST APIs on port 8523
  wiremock:
    image: wiremock/wiremock:latest
    container_name: morning-briefing-wiremock
    ports:
      - "8523:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: --local-response-templating --verbose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Simulates email inbox — SMTP on 1025, HTTP API + Web UI on 8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: morning-briefing-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3
