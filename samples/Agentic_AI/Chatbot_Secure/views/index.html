<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flogo Chatbot (Secure Proxy)</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                    <h1>Flogo Chatbot <span class="badge-secure">Secure Proxy</span></h1>
                </div>
                <div class="connection-controls">
                    <div class="connection-status" id="connectionStatus">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <span id="statusText">Disconnected</span>
                    </div>
                    <button class="btn btn-primary" id="connectBtn">
                        <i class="fas fa-plug"></i> Connect
                    </button>
                    <button class="btn btn-secondary" id="disconnectBtn" disabled>
                        <i class="fas fa-unlink"></i> Disconnect
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar for Chat Sessions -->
            <aside class="sidebar">
                <!-- Sign-in panel (proxy mode): the JWT is sent once to the server, never kept in the page -->
                <section class="auth-panel" id="authPanel">
                    <div class="auth-signed-out" id="authSignedOut">
                        <h2><i class="fas fa-key"></i> Sign in</h2>
                        <label for="jwtInput">Paste your access token (JWT)</label>
                        <input type="password" id="jwtInput" placeholder="eyJhbGciOi..." autocomplete="off"
                               spellcheck="false">
                        <button class="btn btn-primary btn-block" id="signInBtn">
                            <i class="fas fa-right-to-bracket"></i> Sign in
                        </button>
                        <p class="auth-error" id="authError" hidden></p>
                    </div>
                    <div class="auth-signed-in" id="authSignedIn" hidden>
                        <h2><i class="fas fa-user-shield"></i> Signed in</h2>
                        <div class="auth-name" id="authName"></div>
                        <div class="auth-sub" id="authSub"></div>
                        <div class="auth-exp" id="authExp"></div>
                        <div class="auth-scopes" id="authScopes"></div>
                        <button class="btn btn-secondary btn-block" id="signOutBtn">
                            <i class="fas fa-right-from-bracket"></i> Sign out
                        </button>
                    </div>
                </section>
                <div class="sidebar-header">
                    <h2><i class="fas fa-comments"></i> Chat Sessions</h2>
                    <button class="btn btn-icon" id="newChatBtn" title="New Chat">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="chat-sessions" id="chatSessions">
                    <!-- Chat sessions will be dynamically added here -->
                </div>
            </aside>

            <!-- Chat Area -->
            <main class="chat-area">
                <div class="chat-header">
                    <div class="chat-title">
                        <i class="fas fa-comments"></i>
                        <span id="currentChatTitle">Select or create a chat</span>
                    </div>
                    <div class="ws-config">
                        <label class="direct-toggle" id="directToggle" hidden
                               title="Connect straight to the upstream WebSocket with NO token (unauthenticated samples only)">
                            <input type="checkbox" id="directModeInput"> Direct
                        </label>
                        <input type="text" id="wsUrlInput" placeholder="Upstream WebSocket URL" list="upstreamList"
                               value="ws://localhost:9970/retailbanking">
                        <datalist id="upstreamList"></datalist>
                        <button class="btn btn-small" id="updateWsUrlBtn" title="Update WebSocket URL">
                            <i class="fas fa-sync"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message">
                        <i class="fas fa-shield-halved"></i>
                        <h2>Welcome to Flogo Chatbot (Secure Proxy)</h2>
                        <p>Sign in, then click Connect to start a conversation</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-container">
                        <textarea id="messageInput" placeholder="Type your message here..." 
                                  rows="1" disabled></textarea>
                        <button class="btn btn-send" id="sendBtn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
