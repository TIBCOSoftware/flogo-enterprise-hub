<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0066CC 0%, #004999 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0066CC;
            font-size: 20px;
        }

        .app-name {
            font-size: 20px;
            font-weight: 600;
        }

        .connection-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #CC0000;
            transition: background 0.3s;
        }

        .status-indicator.connected {
            background: #00CC66;
        }

        .connect-btn {
            background: white;
            color: #0066CC;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .connect-btn:hover {
            background: #f0f0f0;
        }

        .connect-btn.connected {
            background: #CC0000;
            color: white;
        }

        .connect-btn.connected:hover {
            background: #aa0000;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .new-chat-btn {
            width: 100%;
            background: #0066CC;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #0052a3;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item:hover {
            background: #f5f5f5;
        }

        .chat-item.active {
            background: #e6f2ff;
            border-left: 3px solid #0066CC;
        }

        .chat-item-title {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-chat {
            color: #CC0000;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #0066CC;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .thinking-indicator {
            align-self: flex-start;
            background: #f0f0f0;
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .message-input:focus {
            border-color: #0066CC;
        }

        .send-btn {
            background: #0066CC;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: #0052a3;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            gap: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">+</div>
                <div class="app-name">Agentic Chatbot</div>
            </div>
            <div class="connection-panel">
                <div class="status-indicator" id="statusIndicator"></div>
                <button class="connect-btn" id="connectBtn">Connect</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
                </div>
                <div class="chat-list" id="chatList"></div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">Start a conversation</div>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-container">
                        <input 
                            type="text" 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="Type your message..."
                            disabled
                        >
                        <button class="send-btn" id="sendBtn" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ChatApp {
            constructor() {
                this.ws = null;
                this.isConnected = false;
                this.sessions = [];
                this.currentSessionId = null;
                this.sessionCounter = 0;
                this.wsUrl = 'ws://localhost:8082/ws/chat';
                
                this.initElements();
                this.initEventListeners();
                this.createNewSession();
            }

            initElements() {
                this.statusIndicator = document.getElementById('statusIndicator');
                this.connectBtn = document.getElementById('connectBtn');
                this.newChatBtn = document.getElementById('newChatBtn');
                this.chatList = document.getElementById('chatList');
                this.messagesContainer = document.getElementById('messagesContainer');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
            }

            initEventListeners() {
                this.connectBtn.addEventListener('click', () => this.toggleConnection());
                this.newChatBtn.addEventListener('click', () => this.createNewSession());
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
            }

            toggleConnection() {
                if (this.isConnected) {
                    this.disconnect();
                } else {
                    this.connect();
                }
            }

            connect() {
                try {
                    this.ws = new WebSocket(this.wsUrl);
                    
                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.updateConnectionUI();
                        console.log('Connected to WebSocket');
                    };

                    this.ws.onmessage = (event) => {
                        this.handleMessage(event.data);
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        alert('Connection error. Make sure the WebSocket server is running.');
                    };

                    this.ws.onclose = () => {
                        this.isConnected = false;
                        this.updateConnectionUI();
                        console.log('Disconnected from WebSocket');
                    };
                } catch (error) {
                    console.error('Connection failed:', error);
                    alert('Failed to connect. Check if the server is running.');
                }
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }

            updateConnectionUI() {
                if (this.isConnected) {
                    this.statusIndicator.classList.add('connected');
                    this.connectBtn.textContent = 'Disconnect';
                    this.connectBtn.classList.add('connected');
                    this.messageInput.disabled = false;
                    this.sendBtn.disabled = false;
                } else {
                    this.statusIndicator.classList.remove('connected');
                    this.connectBtn.textContent = 'Connect';
                    this.connectBtn.classList.remove('connected');
                    this.messageInput.disabled = true;
                    this.sendBtn.disabled = true;
                }
            }

            createNewSession() {
                const session = {
                    id: ++this.sessionCounter,
                    title: `Chat ${this.sessionCounter}`,
                    messages: []
                };
                
                this.sessions.push(session);
                this.renderChatList();
                this.switchSession(session.id);
            }

            switchSession(sessionId) {
                this.currentSessionId = sessionId;
                this.renderChatList();
                this.renderMessages();
            }

            deleteSession(sessionId) {
                const index = this.sessions.findIndex(s => s.id === sessionId);
                if (index !== -1) {
                    this.sessions.splice(index, 1);
                    
                    if (this.currentSessionId === sessionId) {
                        if (this.sessions.length > 0) {
                            this.currentSessionId = this.sessions[0].id;
                        } else {
                            this.createNewSession();
                            return;
                        }
                    }
                    
                    this.renderChatList();
                    this.renderMessages();
                }
            }

            getCurrentSession() {
                return this.sessions.find(s => s.id === this.currentSessionId);
            }

            renderChatList() {
                this.chatList.innerHTML = '';
                
                this.sessions.forEach(session => {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    if (session.id === this.currentSessionId) {
                        chatItem.classList.add('active');
                    }
                    
                    chatItem.innerHTML = `
                        <div class="chat-item-title">${session.title}</div>
                        <span class="delete-chat" data-id="${session.id}">×</span>
                    `;
                    
                    chatItem.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('delete-chat')) {
                            this.switchSession(session.id);
                        }
                    });
                    
                    const deleteBtn = chatItem.querySelector('.delete-chat');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.deleteSession(session.id);
                    });
                    
                    this.chatList.appendChild(chatItem);
                });
            }

            renderMessages() {
                const session = this.getCurrentSession();
                if (!session) return;

                this.messagesContainer.innerHTML = '';
                
                if (session.messages.length === 0) {
                    this.messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-text">Start a conversation</div>
                        </div>
                    `;
                    return;
                }

                session.messages.forEach(msg => {
                    if (msg.type === 'thinking') {
                        this.addThinkingIndicator();
                    } else {
                        this.addMessageToDOM(msg.text, msg.type);
                    }
                });

                this.scrollToBottom();
            }

            addMessageToDOM(text, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                messageDiv.textContent = text;
                this.messagesContainer.appendChild(messageDiv);
            }

            addThinkingIndicator() {
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-indicator';
                thinkingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
                this.messagesContainer.appendChild(thinkingDiv);
            }

            removeThinkingIndicator() {
                const thinking = this.messagesContainer.querySelector('.thinking-indicator');
                if (thinking) {
                    thinking.remove();
                }
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            sendMessage() {
                const text = this.messageInput.value.trim();
                if (!text || !this.isConnected) return;

                const session = this.getCurrentSession();
                if (!session) return;

                // Add user message
                session.messages.push({ type: 'user', text });
                this.addMessageToDOM(text, 'user');
                this.messageInput.value = '';

                // Add thinking indicator
                session.messages.push({ type: 'thinking' });
                this.addThinkingIndicator();
                this.scrollToBottom();

                // Send to WebSocket
                this.ws.send(JSON.stringify({ message: text }));
            }

            handleMessage(data) {
                const session = this.getCurrentSession();
                if (!session) return;

                // Remove thinking indicator
                const thinkingIndex = session.messages.findIndex(m => m.type === 'thinking');
                if (thinkingIndex !== -1) {
                    session.messages.splice(thinkingIndex, 1);
                }
                this.removeThinkingIndicator();

                // Add bot response
                let responseText = data;
                try {
                    const parsed = JSON.parse(data);
                    responseText = parsed.response || parsed.message || data;
                } catch (e) {
                    // Use raw data if not JSON
                }

                session.messages.push({ type: 'bot', text: responseText });
                this.addMessageToDOM(responseText, 'bot');
                this.scrollToBottom();

                // Update session title with first message
                if (session.messages.filter(m => m.type === 'user').length === 1) {
                    const firstMessage = session.messages.find(m => m.type === 'user').text;
                    session.title = firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
                    this.renderChatList();
                }
            }
        }

        // Initialize app
        const app = new ChatApp();
    </script>
</body>
</html>
